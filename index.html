<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d19">
    <title>JustUs — Private Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">    <!-- Login and registration -->
    <section id="authScreen" class="auth-screen">
        <div class="auth-card">
            <div class="brand-icon">J</div>

            <h1>JustUs</h1>
            <p class="subtitle">Just two people. One private space.</p>

            <div class="auth-tabs">
                <button id="loginTab" class="tab active" type="button">
                    Log in
                </button>
                <button id="registerTab" class="tab" type="button">
                    Create account
                </button>
            </div>

            <form id="authForm">
                <div id="nameField" class="hidden">
                    <label for="displayName">Your name</label>
                    <input
                        type="text"
                        id="displayName"
                        maxlength="40"
                        autocomplete="name"
                        placeholder="Enter your name"
                    >
                </div>

                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    minlength="6"
                    autocomplete="current-password"
                    placeholder="At least 6 characters"
                    required
                >

                <button id="authSubmit" class="primary-button" type="submit">
                    Log in
                </button>
            </form>

            <button id="forgotPassword" class="text-button" type="button">
                Forgot password?
            </button>

            <button id="resendVerification" class="text-button hidden" type="button">
                Resend verification email
            </button>

            <p id="authMessage" class="status-message" role="status" aria-live="polite"></p>

            <p class="privacy-note">
                A private space reserved for two authorized accounts.
            </p>
        </div>
    </section>

    <!-- Chat -->
    <section id="messenger" class="messenger hidden">
        <header class="chat-header">
            <div class="header-brand">
                <div class="small-brand-icon">J</div>
                <div>
                    <h2>JustUs</h2>
                    <p>Our little corner</p>
                </div>
            </div>

            <button id="logoutButton" class="logout-button" type="button">
                Log out
            </button>
        </header>

        <div class="chat-contact">
            <div class="avatar">♡</div>
            <div class="contact-info">
                <h3 id="chatName">Just Us</h3>
                <p id="chatStatus">Private conversation</p>
            </div>
            <div class="secure-badge">
                <span class="secure-dot"></span>
                Private
            </div>
        </div>

        <div id="messages" class="messages" aria-live="polite">
            <div class="empty-state">
                <div class="empty-heart">♡</div>
                <h3>A space for just us</h3>
                <p>Send the first message and start your conversation.</p>
            </div>
        </div>

        <form id="messageForm" class="message-form">
            <input
                type="text"
                id="messageInput"
                maxlength="4000"
                autocomplete="off"
                placeholder="Write something..."
                aria-label="Your message"
                required
            >
            <button id="sendButton" type="submit">Send</button>
        </form>

        <footer class="chat-footer">Made for two. ♡</footer>
    </section>
</main>

<script type="module" src="app.js"></script>

</body>
</html>
